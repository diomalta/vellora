[package]
name = "vellora-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# =====================================================================
# Pinned upstream versions (see ARCHITECTURE.md "Honest risks": Blitz is
# pre-1.0 and churns; pin exact versions so an upstream break touches one place).
#
# Blitz comes from crates.io at the exact pre-release `=0.3.0-beta.4` (since the
# Phase B port; before it, git rev 2003ba5fc2d8931da9213ef26a813b0d24c83ca6 of
# the v0.3.0-alpha.5 line, the shipped main's engine and the fidelity `pin`
# baseline). The bump is gated by the fidelity chain fidelity/baselines/port
# (head port/00-start) and its debt ledger fidelity/baselines/port/DEBT.json;
# its gate status is in fidelity/baselines/port/README.md.
# All Blitz contact is funneled through `src/blitz_engine.rs` so a bump touches
# one file.
#
#   Blitz 0.3.0-beta.4 (crates.io)
#     - bundles html5ever 0.40 + Stylo 0.22 (cascade) + Taffy 0.15 (layout)
#       + Parley 0.12 (text)
#   krilla 0.8.2 (crates.io) — PDF emit, font subsetting, ToUnicode, metadata.
#     - NOTE: krilla depends on parley only as a DEV-dependency (its example),
#       so there is NO parley version conflict with Blitz's parley 0.12:
#       we hand krilla raw font bytes via `Font::new(Data, index)`.
# =====================================================================

[dependencies]
# --- Blitz: parse -> Stylo cascade -> Taffy layout -> Parley text ---
# NOTE: `system_fonts` is intentionally OFF. vellora bundles its own font and
# supplies a self-contained `FontContext` (see `src/fonts.rs`), so it never links
# `libfontconfig` or reads host fonts — that is what makes output deterministic
# across machines and lets it run on slim/Alpine/Lambda with no system deps.
base64 = "0.22.1"
# `floats` turns on Blitz's float layout (blitz-dom `layout/inline.rs` float placement plus
# `taffy/float_layout` and `stylo_taffy/floats`). It is NOT in blitz-dom 0.3.0-beta.4's
# `default` list (its Cargo.toml [features]), and `default-features = false` would drop it
# anyway, so before Phase C step 04 every `float: left|right` box was laid out as an in-flow
# block. The shipped main (Blitz git 2003ba5, same feature off) did the same: its WPT float
# passes were references that degraded identically (fidelity/gate/snapshots/2026-10-28/c04/).
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["floats"] }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = "=0.3.0-beta.4"
# html5ever, pinned to the exact version blitz-html 0.3.0-beta.4 resolves (its requirement is
# `^0.40.1`; Cargo.lock 0.40.1). `blitz_engine` drives `html5ever::parse_document` with
# blitz-html's `DocumentHtmlParser` sink so every document is parsed as HTML (port step 08):
# that call only compiles while both crates link the SAME html5ever, and
# `tests/html_parse.rs` checks Cargo.lock holds exactly one html5ever, at this version.
html5ever = "=0.40.1"
# Parley/Taffy types re-exported by Blitz; we read (never construct) layouts.
# Matches blitz-dom 0.3.0-beta.4's own `parley ^0.12` (default-features off, std).
parley = { version = "0.12", default-features = false, features = ["std"] }
# Stylo's `style` crate (package `stylo`), pinned to the version Blitz 0.3.0-beta.4
# resolves (`stylo ^0.22.0`), so we can name `style::color::ColorSpace` etc.
style = { package = "stylo", version = "=0.22.0" }
# Stylo's own CSS parser and traits crates, pinned to the versions Stylo 0.22.0 resolves
# (Cargo.lock holds one of each), so `blitz_engine::media_query_matches` can parse a media
# query list with Stylo exactly as its cascade does (port step 09). No new crate in the graph.
cssparser = "=0.38.0"
style_traits = { package = "stylo_traits", version = "=0.22.0" }

# --- krilla: paginated display list -> PDF ---
krilla = "0.8.2"

# WHATWG URL join, used ONLY to normalize a relative <img> `src` against an
# optional `baseUrl` into the lookup key for the caller-supplied `images` map.
# No network/filesystem access happens — this just builds a string key.
url = "2"

[dev-dependencies]
# PDF inspection for tests: text extraction (selectable text / ToUnicode) and
# low-level structure (page count, font subsetting, metadata).
pdf-extract = "0.12"
lopdf = "0.42"
