<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
@page { size: A4; margin: 0 }
body { font-family: sans-serif; font-size: 12pt; margin: 0 }
</style></head>
<body>
  <ul><li>default (outside) disc</li><li>second item</li></ul>
  <ol><li>default (outside) decimal</li><li>second item</li></ol>
  <ul style="list-style-position: inside"><li>inside disc</li></ul>
  <ol><li style="padding-left:20px;border-left:4px solid red">padded</li></ol>
  <ol><li><p style="margin:0;padding-top:10px">block child</p></li></ol>
  <ul style="list-style-type:square"><li>square</li></ul>
  <ol style="list-style-type:lower-alpha"><li>alpha</li></ol>
  <ol style="list-style-type:none"><li>no marker</li></ol>
  <ol><li style="font-size:24pt">big</li></ol>
  <ol dir="rtl" style="width:400px"><li>abc</li></ol>
</body></html>
