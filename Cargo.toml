# vellora Cargo workspace (foundation).
# Members are buildable stubs; rendering crates (Blitz/Stylo/Taffy/Parley/krilla/resvg)
# arrive with the full render path landing.
[workspace]
resolver = "2"
members = ["crates/vellora-core", "crates/vellora-napi", "crates/vellora-wasm"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

# IMPORTANT: do NOT set `panic = "abort"`. `panic` is workspace-wide and not
# per-member overridable, and the napi binding's cdylib panic-to-rejection
# contract depends on unwinding across the FFI boundary (precondition).
[profile.release]
panic = "unwind"

# WebAssembly build of `crates/vellora-wasm` (Cloudflare Workers, edge runtimes, browsers). A
# custom profile, so it never changes `release` (and its mandatory `panic = "unwind"`, above):
# `wasm32-unknown-unknown`'s prebuilt std is `panic = "abort"`, so the wasm binding cannot unwind
# anyway and turns a panic into a trap + instance reset instead (see crates/vellora-wasm/src/lib.rs).
# Workers limits the uncompressed bundle (64 MiB, Free and Paid; there is no compressed limit since
# 2026-09-04), and code size drives compile time and the cold start, so these settings favour a
# small module that stays fast; the measured trade-off of `opt-level` is in packages/wasm/README.md.
# `lto = true` takes effect only because vellora-wasm is a `cdylib` alone (see its Cargo.toml).
[profile.wasm-release]
inherits = "release"
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# `wasm-release` with the `name` section kept, for `packages/wasm/scripts/code-size.mjs` (code per
# crate, issue #66). Same code as `wasm-release` (only symbol stripping differs); never shipped.
[profile.wasm-profiling]
inherits = "wasm-release"
strip = false
