name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-14 = macOS arm64, ubuntu-24.04 = linux x64 — the two dev/CI platforms.
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Provision pinned Rust toolchain
        # `rustup show` installs the channel + components declared in rust-toolchain.toml.
        run: rustup show

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install npm workspace
        run: npm ci --ignore-scripts

      - name: Check dependency install scripts
        run: npm run supply-chain:install-scripts

      - name: Lint (cargo fmt/clippy + biome)
        run: npm run lint

      - name: Check generated COMPATIBILITY.md is in sync with the subset gate
        run: npm run compat:check

      - name: Build (cargo workspace + native addon + TypeScript)
        run: npm run build

      # The WebAssembly engine (@vellora/wasm, issue #63) is platform-independent: build and test
      # it once, on Linux. The CLI must match the wasm-bindgen version in Cargo.lock.
      - name: Install wasm-bindgen CLI
        if: runner.os == 'Linux'
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build the WebAssembly engine
        if: runner.os == 'Linux'
        run: npm run build:wasm

      - name: Check the tracked wasm-bindgen type declarations are current
        if: runner.os == 'Linux'
        run: git diff --exit-code packages/wasm/wasm/vellora.d.ts

      - name: Test (cargo + TypeScript incl. in-process addon load)
        # On Linux the WebAssembly suite is required (it is skipped where the module is not built).
        env:
          VELLORA_WASM_TESTS: ${{ runner.os == 'Linux' && '1' || '' }}
        run: npm test
